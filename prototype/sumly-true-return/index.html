<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sumly 原型</title><style>body{margin:0;background:#1b1b1d;color:#f2f2f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.p{padding:48px 18px 110px}.card{background:#282523;border-radius:20px;padding:20px;margin:12px 0;border:1px solid #ffffff12}.muted{color:#a3a3a3;font-size:13px}.money{font-size:40px;font-weight:800;margin:12px 0}.gold{color:#f2c512}.up{color:#ff5d5d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:999px;padding:14px;font-weight:700}.primary{background:#f2c512;color:#1a1a1a}.secondary{background:#282523;color:#f2c512;border:1px solid #f2c512}.item{width:100%;text-align:left;color:inherit}.bar{position:fixed;bottom:0;left:0;right:0;height:82px;background:#282523;display:flex;justify-content:space-around;align-items:center}.plus{width:62px;height:62px;border-radius:50%;background:#f2c512;color:#1a1a1a;font-size:34px;border:7px solid #1b1b1d;margin-top:-40px}.sheet{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;background:#242220;border-radius:26px 26px 0 0;padding:20px 18px 34px}.input{width:100%;box-sizing:border-box;background:#1e1d1e;border:1px solid #ffffff15;color:white;border-radius:14px;padding:14px;margin:6px 0 12px;font-size:16px}.row{display:flex;justify-content:space-between;gap:10px}.small{font-size:12px}.hero{cursor:pointer}</style></head><body><div class="p"><div class="row"><b style="font-size:20px">默认账本</b><span>◉</span></div><div class="card hero" onclick="detail()"><div class="row"><span class="muted">现在卖预计到手</span><span class="small gold">估算</span></div><div class="money">¥26,910.00</div><div class="row"><span class="muted">真实盈亏 <b class="up">+¥1,110.00</b></span><b class="up">+4.30%</b></div><div class="grid" style="margin-top:18px"><div><div class="muted">总持有</div><b>30.00 g</b></div><div><div class="muted">总投入</div><b>¥25,800.00</b></div></div></div><div class="card" onclick="explain()"><b>已超过真实保本线 <span class="gold">37 元/g</span></b><div class="muted" style="margin-top:7px">当前参考价 ¥905.00/g · 保本 ¥868.00/g</div></div><div class="grid"><button class="btn primary" onclick="add()">＋ 记一笔</button><button class="btn secondary" onclick="calc()">买前算一算</button></div><h3 style="margin-top:24px">我的黄金</h3><button class="card item" onclick="detail()"><div class="row"><div><b>30g 足金手镯</b><div class="muted">周大福 · 2026/08/12</div></div><b class="up">+¥1,110.00</b></div><div class="row muted" style="margin-top:16px"><span>投入 ¥25,800</span><span>预计到手 ¥26,910 ›</span></div></button></div><div class="bar"><span>⌂<br><small>动态</small></span><span class="gold">▣<br><small>记金</small></span><button class="plus" onclick="add()">+</button><span>▤<br><small>记账</small></span><span>●<br><small>我的</small></span></div><div class="sheet" id="sheet" onclick="if(event.target===this)closeS()"><div class="panel" id="panel"></div></div><script>function show(h){panel.innerHTML=h;sheet.classList.add('on')}function closeS(){sheet.classList.remove('on')}function add(){show('<h2>记一笔黄金</h2><p class=muted>先填最少信息，高级参数需要时再展开。</p><label>克重</label><input class=input placeholder="例如 30"><label>购买总价</label><input class=input placeholder="例如 25800"><label>购买日期</label><input class=input type=date><button class="btn secondary" style="width:100%;margin:8px 0">完善真实收益信息 ↓</button><p class=gold>按当前回收规则，预计真实保本金价约为 ¥868/g</p><button class="btn primary" style="width:100%" onclick=closeS()>保存</button>')}function calc(){show('<h2>买前算一算</h2><p class=muted>输入报价后即时计算，不需要先建账。</p><label>克重</label><input class=input value=30><label>商家裸金报价</label><input class=input value=890><label>工费 /g</label><input class=input value=80><div class=card><span class=muted>预计总支出</span><div class=money>¥29,100</div><div class=grid><div>综合成本<br><b>¥970/g</b></div><div>保本金价<br><b>¥978/g</b></div></div></div><button class="btn primary" style="width:100%">保存为持仓</button>')}function detail(){show('<h2>30g 足金手镯</h2><span class=muted>真实盈亏</span><div class="money up">+¥1,110.00</div><div class=grid><div class=card>预计到手<br><b>¥26,910</b></div><div class=card>保本金价<br><b>¥868/g</b></div></div><button class="btn secondary" style="width:100%" onclick=explain()>怎么算的？</button><button class="btn primary" style="width:100%;margin-top:10px" onclick=scenario()>情景测算</button>')}function explain(){show('<h2>怎么算的？</h2><p>当前参考金价 <b>¥905/g</b></p><p>回收每克扣减 <b>¥8/g</b></p><p>有效克重 <b>30g</b></p><div class=card>预计到手 = (905 − 8) × 30 = <b>¥26,910</b><br><br>真实盈亏 = 26,910 − 25,800 = <b class=up>+¥1,110</b></div><p class=muted>当前使用 Sumly 默认回收估算，真实成交价会因渠道而变化。</p>')}function scenario(){show('<h2>情景测算</h2><span class=muted>假如参考金价变成</span><div class=money id=p>¥905/g</div><input style="width:100%;accent-color:#f2c512" type=range min=760 max=1100 value=905 oninput="p.innerText=\'¥\'+this.value+\'/g\'"><div class=card>拖动价格，预计到手、真实盈亏和收益率会实时变化。</div>')}</script></body></html>
