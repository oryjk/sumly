openapi: 3.0.3
info:
  title: Sumly Go API
  version: 1.0.0
  description: sumly 小程序 Go 后端 HTTP API。
servers:
  - url: http://127.0.0.1:18090
    description: 本地开发服务
tags:
  - name: System
  - name: App Auth
  - name: App Holdings
  - name: App Users
  - name: App Market

x-bearer-security: &bearerSecurity
  - bearerAuth: []
x-standard-errors: &standardErrors
  "401":
    $ref: "#/components/responses/Unauthorized"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/ValidationError"
  "500":
    $ref: "#/components/responses/InternalError"

x-native-errors: &nativeErrors
  "401":
    $ref: "#/components/responses/Unauthorized"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/ValidationError"
  "429":
    description: "Rate limit; Retry-After: 60 (minimum)"
    content:
      "application/json":
        schema:
          $ref: "#/components/schemas/ErrorResponse"
  "503":
    description: "Provider disabled or temporarily unavailable"
    content:
      "application/json":
        schema:
          $ref: "#/components/schemas/ErrorResponse"

paths:
  /api/v1/app/holdings:
    get:
      tags: [App Holdings]
      summary: 获取当前账户的持仓快照
      description: |
        用户 ID 仅来自 Bearer 认证，原生 JWT 经过实时会话校验，账户必须 active。
        首次返回 revision 0、默认账本和空 records，不写入数据库。响应上限 4 MiB，Cache-Control 为 no-store。
      security: *bearerSecurity
      responses:
        "200":
          description: Versioned account snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HoldingsResponse"}
        <<: *standardErrors
    put:
      tags: [App Holdings]
      summary: 按版本更新当前账户持仓
      description: |
        JSON 请求和响应最多 4 MiB。expectedRevision 必须等于现有 revision；首次为 0。
        成功返回 revision + 1 与相同文档，409 时不覆盖任何云数据；客户端应 GET 最新快照并三方合并。
        单次事务锁定账户行，校验 active 状态并原子更新版本，与账户删除串行化。
        原生及 Apple 账户删除使用 users DELETE，外键级联原子删除持仓。冻结仅禁止访问，保留数据。
        所有非可选字段必填，不接受 null 或未知字段。disposedAt/purchaseID/purchaseTotalOverride 可省略或 null。
        UUID 大小写均接受，记录 id 按大小写无关去重；提醒 id 在每条记录内去重。
        每条记录 bookName 须出现在 books，assetType 保留历史任意文本。
        unitPriceCNY 为 0 时须有正数 purchaseTotalOverride。纯度为 (0,1]，折扣为 [0,1)。
        日期使用 Unix 毫秒浮点数（允许小数），范围公历 0001–9999 年；disposedAt 不早于 timestamp，处置记录必须有 disposedAt。
        数字须有限，克数为正，金额/提醒阈值非负；文本不得包含 NUL。运行基线、armed 和冷却属于设备状态。
      security: *bearerSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HoldingsPut"}
      responses:
        "200":
          description: Saved snapshot with incremented revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HoldingsResponse"}
        "413":
          description: Request exceeds 4 MiB
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        <<: *standardErrors
  /api/v1/app/market/gold/sync:
    get:
      tags: [App Market]
      summary: 增量同步已收盘历史价格
      description: |
        首次省略 cursor，返回完整快照；以后原样提交 cursor，只返回新增、修正或删除的记录。
        reset=true 时替换本地快照，否则按 granularity/date 合并；deleted=true 删除对应记录。
        游标绑定数据库 epoch 和品种，失效时自动返回完整快照。数据与游标须一起原子保存。
        年度记录只用于 xauusd，范围 1900–2015；日线保留来源提供的交易日，不含当天未收盘报价。
      parameters:
        - in: query
          name: series
          schema: {type: string, enum: [xauusd, au9999, comex-gold], default: xauusd}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 160}
      responses:
        "200":
          description: 完整快照或增量（points 可以为空）
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {type: integer, example: 0}
                  message: {type: string}
                  data:
                    type: object
                    required: [series, unit, cursor, reset, points]
                    properties:
                      series: {type: string}
                      unit: {type: string, enum: [USD/troy_oz, CNY/g]}
                      cursor: {type: string}
                      reset: {type: boolean}
                      points:
                        type: array
                        items:
                          type: object
                          required: [date, granularity, open, high, low, close, source, deleted]
                          properties:
                            date: {type: string, format: date}
                            granularity: {type: string, enum: [annual, daily]}
                            open: {type: number}
                            high: {type: number}
                            low: {type: number}
                            close: {type: number}
                            source: {type: string}
                            deleted: {type: boolean}
        "400":
          description: 不支持的品种或游标过长

  /api/v1/app/market/gold/history:
    get:
      tags: ["App Market"]
      operationId: goldLongHistory
      summary: Gold annual references 1900–2015 and daily closes from 2016
      description: Nominal USD per troy ounce. Annual USGS DS140 points use July 1 only as a plotting date; daily points are Sina XAUUSD closes. Non-trading days are not synthesized.
      security: []
      responses:
        "200":
          description: Chronological annual and daily observations
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {type: integer, enum: [0]}
                  message: {type: string}
                  data:
                    type: object
                    required: [unit, points]
                    properties:
                      unit: {type: string, enum: ["USD/troy_oz"]}
                      points:
                        type: array
                        items:
                          type: object
                          required: [date, price, granularity, source]
                          properties:
                            date: {type: string, format: date}
                            price: {type: number, exclusiveMinimum: true, minimum: 0}
                            granularity: {type: string, enum: [annual, daily]}
                            source: {type: string, enum: [usgs-ds140, sina-xauusd]}
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/capabilities:
    get:
      tags: ["App Auth"]
      operationId: "nativeCapabilities"
      summary: "Provider availability; missing credentials and global disable return false."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeCapabilitiesResponse"

  /api/v1/app/auth/apple/challenge:
    post:
      tags: ["App Auth"]
      operationId: "nativeAppleChallenge"
      summary: "Single-use five-minute server nonce."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeChallengeResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties: {}
              required: []
              additionalProperties: false

  /api/v1/app/auth/apple/login:
    post:
      tags: ["App Auth"]
      operationId: "nativeAppleLogin"
      summary: "Verified Apple identity and authorization code. Nickname is optional; never links accounts by email."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeLoginResultResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                challenge_id:
                  type: "string"
                identity_token:
                  type: "string"
                authorization_code:
                  type: "string"
                nickname:
                  type: "string"
                  maxLength: 120
              required: ["challenge_id", "identity_token", "authorization_code"]
              additionalProperties: false

  /api/v1/app/auth/apple/notifications:
    post:
      tags: ["App Auth"]
      operationId: "nativeAppleServerNotification"
      summary: "Apple Sign in with Apple server-to-server account-change notification endpoint."
      description: "Verifies Apple-signed JWS notifications (signature, issuer, audience, issued-at, and expiration when present). consent-revoked revokes active sessions and clears the stored Apple refresh credential; account-deleted deletes the Apple-backed Sumly account. email-enabled/email-disabled are accepted without account mutation because Sumly does not use Apple relay email as an identity."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Notification accepted"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                payload:
                  type: "string"
                  maxLength: 16384
                  description: "Apple-signed JWS notification payload."
              required: ["payload"]
              additionalProperties: false

  /api/v1/app/auth/phone/code:
    post:
      tags: ["App Auth"]
      operationId: "nativePhoneCode"
      summary: "Mainland China SMS. Cooldown 60s; 5 sends/hour, 20/day per destination; 30/IP/hour and 1000 global/hour. Five guesses, five-minute validity."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeCodeSentResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                phone_number:
                  type: "string"
                  description: "Mainland China mobile, local 11 digits or +86 E.164."
              required: ["phone_number"]
              additionalProperties: false

  /api/v1/app/auth/phone/login:
    post:
      tags: ["App Auth"]
      operationId: "nativePhoneLogin"
      summary: "First verified phone auto-registers."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeLoginResultResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                phone_number:
                  type: "string"
                  description: "Mainland China mobile, local 11 digits or +86 E.164."
                code:
                  type: "string"
                  pattern: "^[0-9]{6}$"
              required: ["phone_number", "code"]
              additionalProperties: false

  /api/v1/app/auth/email/code:
    post:
      tags: ["App Auth"]
      operationId: "nativeEmailCode"
      summary: "Non-enumerating send response; same quotas as phone, shared across email purposes."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeCodeSentResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                  format: "email"
                  maxLength: 254
                purpose:
                  type: "string"
                  enum: ["register", "reset_password"]
              required: ["email", "purpose"]
              additionalProperties: false

  /api/v1/app/auth/email/register:
    post:
      tags: ["App Auth"]
      operationId: "nativeEmailRegister"
      summary: "Requires email verification; duplicate identities never overwrite credentials."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeLoginResultResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                  format: "email"
                  maxLength: 254
                password:
                  type: "string"
                  minLength: 12
                  maxLength: 128
                  description: "12–128 Unicode code points, at most 512 UTF-8 bytes; never trimmed."
                code:
                  type: "string"
                  pattern: "^[0-9]{6}$"
              required: ["email", "password", "code"]
              additionalProperties: false

  /api/v1/app/auth/email/login:
    post:
      tags: ["App Auth"]
      operationId: "nativeEmailLogin"
      summary: "Generic invalid credentials. Persistent password/IP quotas before hashing."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeLoginResultResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                  format: "email"
                  maxLength: 254
                password:
                  type: "string"
                  minLength: 12
                  maxLength: 128
                  description: "12–128 Unicode code points, at most 512 UTF-8 bytes; never trimmed."
              required: ["email", "password"]
              additionalProperties: false

  /api/v1/app/auth/email/reset-password:
    post:
      tags: ["App Auth"]
      operationId: "nativeEmailResetPassword"
      summary: "Single-use verified code; changes existing identity only and revokes all native sessions. Does not log in."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeEmptyResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                  format: "email"
                  maxLength: 254
                code:
                  type: "string"
                  pattern: "^[0-9]{6}$"
                new_password:
                  type: "string"
                  minLength: 12
                  maxLength: 128
                  description: "12–128 Unicode code points, at most 512 UTF-8 bytes; never trimmed."
              required: ["email", "code", "new_password"]
              additionalProperties: false

  /api/v1/app/auth/refresh:
    post:
      tags: ["App Auth"]
      operationId: "nativeRefresh"
      summary: "Single-use opaque refresh rotation; absolute 30-day lifetime. Does not renew primary authentication time."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeLoginResultResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                refresh_token:
                  type: "string"
              required: ["refresh_token"]
              additionalProperties: false

  /api/v1/app/auth/logout:
    post:
      tags: ["App Auth"]
      operationId: "nativeLogout"
      summary: "Idempotent session-family revocation, including already rotated tokens."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeEmptyResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                refresh_token:
                  type: "string"
              required: ["refresh_token"]
              additionalProperties: false

  /api/v1/app/auth/me:
    get:
      tags: ["App Auth"]
      operationId: "nativeMe"
      summary: "Requires live native session and active user; legacy tokens are rejected."
      security: [{"bearerAuth": []}]
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeUserResponse"

  /api/v1/app/auth/account:
    delete:
      tags: ["App Auth"]
      operationId: "nativeAccount"
      summary: "Requires primary login in last 5 minutes. Revokes Apple token and transactionally deletes server account. Local device holdings remain untouched."
      security: [{"bearerAuth": []}]
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeEmptyResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                confirmation:
                  type: "string"
                  enum: ["DELETE"]
              required: ["confirmation"]
              additionalProperties: false

  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: 健康检查
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/app/auth/wechat/login:
    post:
      operationId: loginAppWithWechat
      tags: [App Auth]
      summary: 微信登录
      description: 用 wx.login 返回的 js_code 换取 openid；用户不存在时自动注册并签发 JWT。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatLoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatLoginResponse"
        "401":
          description: 微信 code 无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/app/auth/dev/login:
    post:
      operationId: loginAppWithDevIdentifier
      tags: [App Auth]
      summary: 开发测试登录（仅开发环境）
      description: 仅开发测试使用，需后端 DEV_LOGIN_ENABLED=true，未启用时该路由不注册（404）。identifier 加 dev- 前缀作为 openid，用户不存在时自动注册并签发 JWT。生产环境禁止开启。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatLoginResponse"
        "403":
          description: 用户已冻结
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/app/users/me:
    get:
      operationId: getAppMe
      tags: [App Users]
      summary: 获取当前用户资料
      security: *bearerSecurity
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        <<: *standardErrors
    patch:
      operationId: updateAppMe
      tags: [App Users]
      summary: 更新当前用户资料
      security: *bearerSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        <<: *standardErrors

  /api/v1/app/market/gold/quote:
    get:
      operationId: getGoldQuote
      tags: [App Market]
      summary: 伦敦金实时报价
      description: 实时报价（XAU/USD，美元/盎司），含当日涨跌；服务端短 TTL 缓存，上游故障时返回最近一次缓存。公开接口，无需登录。
      security: []
      responses:
        "200":
          description: 实时报价
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldQuoteResponse"
        "500":
          description: 行情源不可用且无缓存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/app/market/gold/instruments:
    get:
      operationId: listGoldInstruments
      tags: [App Market]
      summary: 黄金品种目录及来源、单位、延迟信息
      security: []
      responses:
        "200":
          description: data.instruments 品种列表；au9999、xauusd、comex-gold。COMEX 固定为 GCZ26，延迟1800秒，不是CFD。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer}
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      instruments:
                        type: array
                        items: {$ref: '#/components/schemas/GoldInstrument'}
  /api/v1/app/market/gold/instruments/{instrument}/quote:
    get:
      operationId: getInstrumentGoldQuote
      tags: [App Market]
      summary: 原始单位报价与人民币折算
      description: 响应包含 instrument 元数据。国内 CNY/g；伦敦与COMEX为 USD/troy_oz。COMEX为GCZ26延迟报价。实时窗口停更不清空，interval_seconds 为5或真实分钟回退60；不填造缺失样本。
      security: []
      parameters:
        - in: path
          name: instrument
          required: true
          schema:
            type: string
            enum: [au9999, xauusd, comex-gold]
      responses:
        "200":
          description: 成功，统一 code/message/data envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer}
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      instrument: {$ref: '#/components/schemas/GoldInstrument'}
        "404":
          description: 未知行情品种
        "500":
          description: 上游不可用且没有可用缓存
  /api/v1/app/market/gold/instruments/{instrument}/daily:
    get:
      operationId: getInstrumentGoldDaily
      tags: [App Market]
      summary: 按交易日保存的原始单位日线
      description: 响应包含 instrument 元数据。国内 CNY/g；伦敦与COMEX为 USD/troy_oz。COMEX为GCZ26延迟报价。实时窗口停更不清空，interval_seconds 为5或真实分钟回退60；不填造缺失样本。
      security: []
      parameters:
        - in: path
          name: instrument
          required: true
          schema:
            type: string
            enum: [au9999, xauusd, comex-gold]
      responses:
        "200":
          description: 成功，统一 code/message/data envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer}
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      instrument: {$ref: '#/components/schemas/GoldInstrument'}
        "404":
          description: 未知行情品种
        "500":
          description: 上游不可用且没有可用缓存
  /api/v1/app/market/gold/instruments/{instrument}/realtime:
    get:
      operationId: getInstrumentGoldRealtime
      tags: [App Market]
      summary: 以最后可用行情为终点的二十分钟走势
      description: 响应包含 instrument 元数据。国内 CNY/g；伦敦与COMEX为 USD/troy_oz。COMEX为GCZ26延迟报价。实时窗口停更不清空，interval_seconds 为5或真实分钟回退60；不填造缺失样本。
      security: []
      parameters:
        - in: path
          name: instrument
          required: true
          schema:
            type: string
            enum: [au9999, xauusd, comex-gold]
      responses:
        "200":
          description: 成功，统一 code/message/data envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer}
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      instrument: {$ref: '#/components/schemas/GoldInstrument'}
        "404":
          description: 未知行情品种
        "500":
          description: 上游不可用且没有可用缓存

  /api/v1/app/market/gold/realtime:
    get:
      operationId: getGoldRealtime
      tags: [App Market]
      summary: 最后有效行情之前二十分钟的走势
      description: 后台每5秒向上游采样一次，每个切片保留最近一次真实返回值，按采样时汇率折算人民币每克。time 为服务端采样时间，source_time 为上游报价时间（分钟精度）。失败或过期报价不追加，缺口不插值；采样持久化到 PostgreSQL，以最新有效行情为终点保留二十分钟，停更或重启不清空。停更时末点对应上游最后报价；缺少秒级走势时可回退真实分钟记录，interval_seconds 为 60，按最新可用汇率折算。日线按交易日长期保存。
      security: []
      responses:
        "200":
          description: 最后可用走势窗口；冷启动且尚未获得历史时可能为空
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      symbol:
                        type: string
                        example: XAUUSD
                      unit:
                        type: string
                        enum: [CNY/g]
                      interval_seconds:
                        type: integer
                        enum: [5, 60]
                        description: 5 为实际五秒采样；60 为秒级历史缺失时的真实分钟记录回退，按最新可用汇率折算。窗口以最后有效行情为终点，停更不会清空。
                        example: 5
                      window_seconds:
                        type: integer
                        example: 1200
                      points:
                        type: array
                        items:
                          type: object
                          required: [time, source_time, price]
                          properties:
                            time:
                              type: string
                              format: date-time
                            source_time:
                              type: string
                              format: date-time
                            price:
                              type: number
                              description: 采样时人民币每克价格

  /api/v1/app/market/gold/intraday:
    get:
      operationId: getGoldIntraday
      tags: [App Market]
      summary: 伦敦金最新交易日分钟行情
      description: XAU/USD 美元/盎司，时间升序，RFC3339 北京时间。后台每 15 秒采集并持久化；读取最后成功快照，上游失败保留原始时间戳，GET 不回源或写入。人民币折算需结合 quote 的 usd_cny，不能视作历史人民币成交价。
      security: []
      responses:
        "200":
          description: 分钟行情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      symbol:
                        type: string
                        example: XAUUSD
                      points:
                        type: array
                        items:
                          type: object
                          required: [time, price]
                          properties:
                            time:
                              type: string
                              format: date-time
                            price:
                              type: number
                              description: 美元/盎司
        "500":
          description: 行情源不可用且无缓存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/app/market/gold/daily:
    get:
      operationId: getGoldDailyKLines
      tags: [App Market]
      summary: 伦敦金日 K 线
      description: 2006 年至今的日线序列（北京时间交易日），升序；从持久化日线读取，仅包含已收盘的有效交易日；后台独立同步，GET 不回源或写入。公开接口，无需登录。
      security: []
      responses:
        "200":
          description: 日线序列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldDailyResponse"
        "500":
          description: 行情源不可用且无缓存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: 未登录或凭证无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 无权访问
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HoldingsPut:
      type: object
      additionalProperties: false
      required: [expectedRevision, document]
      properties:
        expectedRevision: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775806}
        document: {$ref: "#/components/schemas/HoldingsDocument"}
    HoldingsResponse:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, enum: [0]}
        message: {type: string, enum: [ok]}
        data:
          type: object
          required: [revision, document]
          properties:
            revision: {type: integer, format: int64, minimum: 0}
            document: {$ref: "#/components/schemas/HoldingsDocument"}
    HoldingsDocument:
      type: object
      additionalProperties: false
      required: [schemaVersion, books, records]
      properties:
        schemaVersion: {type: integer, enum: [1]}
        books:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 100}
        records:
          type: array
          maxItems: 1000
          items: {$ref: "#/components/schemas/HoldingRecord"}
    HoldingRecord:
      type: object
      additionalProperties: false
      required: [id, grams, unitPriceCNY, timestamp, note, createdAt, brand, bookName, disposition, disposalAmount, extraFee, purchaseChannel, counterparty, assetType, purity, laborFee, recoveryDeduction, recoveryDiscount, recoveryFixedFee, alerts]
      properties:
        id: {type: string, format: uuid}
        grams: {type: number, format: double, minimum: 0, exclusiveMinimum: true}
        unitPriceCNY: {type: number, format: double, minimum: 0}
        timestamp: {$ref: "#/components/schemas/HoldingsDate"}
        createdAt: {$ref: "#/components/schemas/HoldingsDate"}
        note: {type: string, maxLength: 2000}
        brand: {type: string, maxLength: 200}
        bookName: {type: string, minLength: 1, maxLength: 100}
        disposition: {type: string, enum: [holding, sold, gift]}
        disposedAt:
          type: number
          format: double
          nullable: true
          minimum: -62135596800000
          maximum: 253402300799999
        disposalAmount: {type: number, format: double, minimum: 0}
        purchaseID: {type: string, format: uuid, nullable: true}
        extraFee: {type: number, format: double, minimum: 0}
        purchaseChannel: {type: string, maxLength: 200}
        counterparty: {type: string, maxLength: 200}
        assetType: {type: string, maxLength: 200}
        purity: {type: number, format: double, minimum: 0, exclusiveMinimum: true, maximum: 1}
        laborFee: {type: number, format: double, minimum: 0}
        purchaseTotalOverride: {type: number, format: double, minimum: 0, nullable: true}
        recoveryDeduction: {type: number, format: double, minimum: 0}
        recoveryDiscount: {type: number, format: double, minimum: 0, maximum: 1, exclusiveMaximum: true}
        recoveryFixedFee: {type: number, format: double, minimum: 0}
        alerts:
          type: array
          maxItems: 4
          items: {$ref: "#/components/schemas/HoldingAlert"}
    HoldingsDate:
      type: number
      format: double
      description: Unix epoch milliseconds; fractional milliseconds are preserved
      minimum: -62135596800000
      maximum: 253402300799999
    HoldingAlert:
      type: object
      additionalProperties: false
      required: [id, kind, threshold, enabled, basis]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [breakEven, returnPercent, profitAmount, price]}
        threshold: {type: number, format: double, minimum: 0}
        enabled: {type: boolean}
        basis: {type: string, enum: [domestic, international]}
    NativeUser:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        nickname:
          type: "string"
        avatar_url:
          type: "string"
        email:
          type: "string"
          format: "email"
          maxLength: 254
          nullable: true
        phone_number:
          type: "string"
          nullable: true
        status:
          type: "string"
          enum: ["active", "frozen"]
        provider:
          type: "string"
          enum: ["apple", "phone", "email"]
      required: ["id", "nickname", "avatar_url", "email", "phone_number", "status", "provider"]
    NativeLoginResult:
      type: "object"
      properties:
        token:
          type: "string"
        refresh_token:
          type: "string"
        expires_in:
          type: "integer"
          enum: [900]
        user:
          $ref: "#/components/schemas/NativeUser"
      required: ["token", "refresh_token", "expires_in", "user"]
    NativeCapabilities:
      type: "object"
      properties:
        apple:
          type: "boolean"
        phone:
          type: "boolean"
        email:
          type: "boolean"
      required: ["apple", "phone", "email"]
    NativeChallenge:
      type: "object"
      properties:
        challenge_id:
          type: "string"
        nonce:
          type: "string"
          description: "Exact nonce for Apple request; do not hash again."
        expires_in:
          type: "integer"
          enum: [300]
      required: ["challenge_id", "nonce", "expires_in"]
    NativeCodeSent:
      type: "object"
      properties:
        retry_after:
          type: "integer"
          enum: [60]
        expires_in:
          type: "integer"
          enum: [300]
      required: ["retry_after", "expires_in"]
    NativeEmpty:
      type: "object"
      additionalProperties: false
    NativeCapabilitiesResponse:
      type: "object"
      properties:
        code:
          type: "integer"
          enum: [0]
        message:
          type: "string"
        data:
          $ref: "#/components/schemas/NativeCapabilities"
      required: ["code", "message", "data"]
    NativeChallengeResponse:
      type: "object"
      properties:
        code:
          type: "integer"
          enum: [0]
        message:
          type: "string"
        data:
          $ref: "#/components/schemas/NativeChallenge"
      required: ["code", "message", "data"]
    NativeLoginResultResponse:
      type: "object"
      properties:
        code:
          type: "integer"
          enum: [0]
        message:
          type: "string"
        data:
          $ref: "#/components/schemas/NativeLoginResult"
      required: ["code", "message", "data"]
    NativeCodeSentResponse:
      type: "object"
      properties:
        code:
          type: "integer"
          enum: [0]
        message:
          type: "string"
        data:
          $ref: "#/components/schemas/NativeCodeSent"
      required: ["code", "message", "data"]
    NativeEmptyResponse:
      type: "object"
      properties:
        code:
          type: "integer"
          enum: [0]
        message:
          type: "string"
        data:
          $ref: "#/components/schemas/NativeEmpty"
      required: ["code", "message", "data"]
    NativeUserResponse:
      type: "object"
      properties:
        code:
          type: "integer"
          enum: [0]
        message:
          type: "string"
        data:
          $ref: "#/components/schemas/NativeUser"
      required: ["code", "message", "data"]
    GoldInstrument:
      type: object
      required: [id, name, symbol, kind, currency, unit, quote_source, daily_source, delay_seconds]
      properties:
        id: {type: string}
        name: {type: string}
        symbol: {type: string}
        kind: {type: string, enum: [spot, future]}
        currency: {type: string, enum: [CNY, USD]}
        unit: {type: string, enum: [CNY/g, USD/troy_oz]}
        quote_source: {type: string}
        daily_source: {type: string}
        delay_seconds: {type: integer, minimum: 0}
        exchange: {type: string}
        contract: {type: string}
    HealthResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          type: object
          properties:
            status:
              type: string
              example: ok

    WechatLoginRequest:
      type: object
      required: [js_code]
      properties:
        js_code:
          type: string
          description: wx.login 返回的临时登录凭证

    DevLoginRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          maxLength: 120
          description: 开发测试标识（如 test-user-01），后端加 dev- 前缀作为 openid

    WechatLoginResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          type: object
          properties:
            token:
              type: string
            user:
              $ref: "#/components/schemas/AppUser"

    UpdateMeRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 120
        real_name:
          type: string
          maxLength: 120

    ProfileResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          $ref: "#/components/schemas/AppUser"

    AppUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        real_name:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, frozen]

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true

    GoldQuoteResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          type: object
          properties:
            symbol:
              type: string
              example: XAUUSD
            price:
              type: number
              example: 4288.66
            open:
              type: number
              example: 4288.66
            high:
              type: number
              example: 4318.02
            low:
              type: number
              example: 4257.40
            prev_close:
              type: number
              example: 4263.94
            change:
              type: number
              example: 24.72
            change_percent:
              type: number
              example: 0.58
            usd_cny:
              type: number
              description: 美元兑人民币汇率（买/卖中间价）；0 表示不可用
              example: 6.7084
            cny_per_gram:
              type: number
              description: 每克人民币价；0 表示不可用
              example: 924.98
            as_of:
              type: string
              format: date-time
              description: 报价时间（RFC3339，北京时间）
              example: "2026-09-17T13:19:00+08:00"

    GoldDailyResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          type: object
          properties:
            symbol:
              type: string
              example: XAUUSD
            bars:
              type: array
              items:
                $ref: "#/components/schemas/GoldDailyBar"

    GoldDailyBar:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-09-16"
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
