openapi: 3.0.3
info:
  title: Sumly Go API
  version: 1.0.0
  description: sumly 小程序 Go 后端 HTTP API。
servers:
  - url: http://127.0.0.1:18090
    description: 本地开发服务
tags:
  - name: System
  - name: App Auth
  - name: App Holdings
  - name: App Users
  - name: App Market
  - name: App Macro
  - name: Internal Macro

x-bearer-security: &bearerSecurity
  - bearerAuth: []
x-standard-errors: &standardErrors
  "401":
    $ref: "#/components/responses/Unauthorized"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/ValidationError"
  "500":
    $ref: "#/components/responses/InternalError"

x-native-errors: &nativeErrors
  "401":
    $ref: "#/components/responses/Unauthorized"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/ValidationError"
  "429":
    description: "Rate limit; Retry-After: 60 (minimum)"
    content:
      "application/json":
        schema:
          $ref: "#/components/schemas/ErrorResponse"
  "503":
    description: "Provider disabled or temporarily unavailable"
    content:
      "application/json":
        schema:
          $ref: "#/components/schemas/ErrorResponse"

paths:
  /api/v1/app/holdings:
    get:
      tags: [App Holdings]
      summary: 获取当前账户的持仓快照
      description: |
        用户 ID 仅来自 Bearer 认证，原生 JWT 经过实时会话校验，账户必须 active。
        首次返回 revision 0、默认账本和空 records，不写入数据库。响应上限 4 MiB，Cache-Control 为 no-store。
      security: *bearerSecurity
      responses:
        "200":
          description: Versioned account snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HoldingsResponse"}
        <<: *standardErrors
    put:
      tags: [App Holdings]
      summary: 按版本更新当前账户持仓
      description: |
        JSON 请求和响应最多 4 MiB。expectedRevision 必须等于现有 revision；首次为 0。
        成功返回 revision + 1 与相同文档，409 时不覆盖任何云数据；客户端应 GET 最新快照并三方合并。
        单次事务锁定账户行，校验 active 状态并原子更新版本，与账户删除串行化。
        原生及 Apple 账户删除使用 users DELETE，外键级联原子删除持仓。冻结仅禁止访问，保留数据。
        所有非可选字段必填，不接受 null 或未知字段。disposedAt/purchaseID/purchaseTotalOverride 可省略或 null。
        UUID 大小写均接受，记录 id 按大小写无关去重；提醒 id 在每条记录内去重。
        每条记录 bookName 须出现在 books，assetType 保留历史任意文本。
        unitPriceCNY 为 0 时须有正数 purchaseTotalOverride。纯度为 (0,1]，折扣为 [0,1)。
        日期使用 Unix 毫秒浮点数（允许小数），范围公历 0001–9999 年；disposedAt 不早于 timestamp，处置记录必须有 disposedAt。
        数字须有限，克数为正，金额/提醒阈值非负；文本不得包含 NUL。运行基线、armed 和冷却属于设备状态。
      security: *bearerSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HoldingsPut"}
      responses:
        "200":
          description: Saved snapshot with incremented revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HoldingsResponse"}
        "413":
          description: Request exceeds 4 MiB
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        <<: *standardErrors
  /api/v1/app/market/gold/sync:
    get:
      tags: [App Market]
      summary: 增量同步已收盘历史价格
      description: |
        首次省略 cursor，返回完整快照；以后原样提交 cursor，只返回新增、修正或删除的记录。
        reset=true 时替换本地快照，否则按 granularity/date 合并；deleted=true 删除对应记录。
        游标绑定数据库 epoch 和品种，失效时自动返回完整快照。数据与游标须一起原子保存。
        年度记录只用于 xauusd，范围 1900–2015；日线保留来源提供的交易日，不含当天未收盘报价。
      parameters:
        - in: query
          name: series
          schema: {type: string, enum: [xauusd, au9999, comex-gold], default: xauusd}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 160}
      responses:
        "200":
          description: 完整快照或增量（points 可以为空）
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {type: integer, example: 0}
                  message: {type: string}
                  data:
                    type: object
                    required: [series, unit, cursor, reset, points]
                    properties:
                      series: {type: string}
                      unit: {type: string, enum: [USD/troy_oz, CNY/g]}
                      cursor: {type: string}
                      reset: {type: boolean}
                      points:
                        type: array
                        items:
                          type: object
                          required: [date, granularity, open, high, low, close, source, deleted]
                          properties:
                            date: {type: string, format: date}
                            granularity: {type: string, enum: [annual, daily]}
                            open: {type: number}
                            high: {type: number}
                            low: {type: number}
                            close: {type: number}
                            source: {type: string}
                            deleted: {type: boolean}
        "400":
          description: 不支持的品种或游标过长

  /api/v1/app/market/gold/history:
    get:
      tags: ["App Market"]
      operationId: goldLongHistory
      summary: Gold annual references 1900–2015 and daily closes from 2016
      description: Nominal USD per troy ounce. Annual USGS DS140 points use July 1 only as a plotting date; daily points are Sina XAUUSD closes. Non-trading days are not synthesized.
      security: []
      responses:
        "200":
          description: Chronological annual and daily observations
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {type: integer, enum: [0]}
                  message: {type: string}
                  data:
                    type: object
                    required: [unit, points]
                    properties:
                      unit: {type: string, enum: ["USD/troy_oz"]}
                      points:
                        type: array
                        items:
                          type: object
                          required: [date, price, granularity, source]
                          properties:
                            date: {type: string, format: date}
                            price: {type: number, exclusiveMinimum: true, minimum: 0}
                            granularity: {type: string, enum: [annual, daily]}
                            source: {type: string, enum: [usgs-ds140, sina-xauusd]}
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/capabilities:
    get:
      tags: ["App Auth"]
      operationId: "nativeCapabilities"
      summary: "Provider availability and optional credential-linking capabilities."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeCapabilitiesResponse"

  /api/v1/app/auth/apple/challenge:
    post:
      tags: ["App Auth"]
      operationId: "nativeAppleChallenge"
      summary: "Single-use five-minute server nonce."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeChallengeResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties: {}
              required: []
              additionalProperties: false

  /api/v1/app/auth/apple/login:
    post:
      tags: ["App Auth"]
      operationId: "nativeAppleLogin"
      summary: "Verified Apple identity and authorization code. Nickname is optional; never links accounts by email."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeLoginResultResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                challenge_id:
                  type: "string"
                identity_token:
                  type: "string"
                authorization_code:
                  type: "string"
                nickname:
                  type: "string"
                  maxLength: 120
              required: ["challenge_id", "identity_token", "authorization_code"]
              additionalProperties: false

  /api/v1/app/auth/apple/reauthenticate/challenge:
    post:
      tags: ["App Auth"]
      operationId: "nativeAppleReauthenticationChallenge"
      summary: "Issue a single-use Apple nonce for the active Apple session family."
      description: "Available when apple_email_link is enabled. Requires an active Apple session. The client passes the returned nonce verbatim to Sign in with Apple."
      security: [{"bearerAuth": []}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeChallengeResponse"

  /api/v1/app/auth/apple/reauthenticate:
    post:
      tags: ["App Auth"]
      operationId: "nativeAppleReauthenticate"
      summary: "Confirm the Apple identity already on the active Sumly account."
      description: "A different Apple identity returns 409 without creating an account. Invalid, expired or reused proof returns 422. Success issues a fresh session family for the same user. The client can revoke the previous family after saving the new session."
      security: [{"bearerAuth": []}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                challenge_id: {type: "string", minLength: 43, maxLength: 43}
                identity_token: {type: "string", minLength: 1, maxLength: 16384}
                authorization_code: {type: "string", minLength: 1, maxLength: 4096}
              required: ["challenge_id", "identity_token", "authorization_code"]
              additionalProperties: false
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeLoginResultResponse"

  /api/v1/app/auth/google/challenge:
    post:
      tags: ["App Auth"]
      operationId: "nativeGoogleChallenge"
      summary: "Issue a single-use five-minute Google nonce."
      description: "Omit Authorization for sign-in. Supply the Bearer token of a native email session authenticated within the last five minutes for account linking."
      security: [{}, {"bearerAuth": []}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeChallengeResponse"

  /api/v1/app/auth/google/login:
    post:
      tags: ["App Auth"]
      operationId: "nativeGoogleLogin"
      summary: "Sign in with a verified Google ID token and sign-in challenge."
      description: "A new Google identity whose verified email matches an existing email login returns 409. Sign in with email and explicitly link the Google credential to retain the existing user ID."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/NativeGoogleToken"
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeLoginResultResponse"

  /api/v1/app/auth/google/link:
    post:
      tags: ["App Auth"]
      operationId: "nativeGoogleLink"
      summary: "Bind Google to the current native email account using a session-bound challenge."
      description: "Requires email authentication within the last five minutes. Both credentials sign in as the same user ID. An invalid or expired proof returns 422. A Google credential already owned by another account returns 409."
      security: [{"bearerAuth": []}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/NativeGoogleToken"
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeEmptyResponse"

  /api/v1/app/auth/google/reauthenticate/challenge:
    post:
      tags: ["App Auth"]
      operationId: "nativeGoogleReauthenticationChallenge"
      summary: "Issue a single-use five-minute Google nonce for reauthentication."
      description: "Requires an active native Google session. The challenge belongs to that user's session family."
      security: [{"bearerAuth": []}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeChallengeResponse"

  /api/v1/app/auth/google/reauthenticate:
    post:
      tags: ["App Auth"]
      operationId: "nativeGoogleReauthenticate"
      summary: "Verify the Google identity on the active native session."
      description: "A different Google account returns 409 without creating an account. Invalid, expired or reused proof returns 422. On success a new session family is issued for the existing user. After saving it the client can revoke the previous session family through logout."
      security: [{"bearerAuth": []}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/NativeGoogleToken"
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeLoginResultResponse"

  /api/v1/app/auth/wechat/session:
    post:
      tags: ["App Auth"]
      operationId: "nativeWechatSessionLogin"
      summary: "微信小程序统一会话登录"
      description: |
        用 uni.login 返回的 js_code 换取 openid，签发与手机号/邮箱相同结构的
        access/refresh 会话（access 有效期 900 秒）。身份以 appid + openid 编码，
        禁止跨 appid 误绑定。

        旧 /auth/wechat/login 签发的 24 小时 JWT 不能刷新或注销，其契约保持不变；
        两条链路共用同一身份解析，不会为同一 openid 创建两个账户。

        旧微信用户只在 WECHAT_LEGACY_APP_ID 与 WECHAT_APP_ID 明确一致时
        才迁移到新身份，复用原用户 ID，不复制或重新归属持仓；归属未确认时
        不做猜测性关联。

        未配置 WECHAT_APP_ID 时不注册该路由，capabilities.wechat 为 false。
        响应不含 openid 与 session_key。
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                js_code:
                  type: "string"
                  description: "uni.login 返回的临时登录凭证"
              required: ["js_code"]
              additionalProperties: false
      responses:
        "200":
          description: "成功，返回统一 code/message/data envelope"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, example: 0}
                  message: {type: string, example: ok}
                  data:
                    $ref: "#/components/schemas/NativeLoginResult"
        "401":
          description: "code 无效、上游拒绝或账户不可用"
        "422":
          description: "js_code 为空或包含未知字段"
        "503":
          description: "微信登录未配置"

  /api/v1/app/auth/apple/notifications:
    post:
      tags: ["App Auth"]
      operationId: "nativeAppleServerNotification"
      summary: "Apple Sign in with Apple server-to-server account-change notification endpoint."
      description: "Verifies Apple-signed JWS notifications (signature, issuer, audience, issued-at, and expiration when present). consent-revoked revokes active sessions and clears the stored Apple refresh credential; account-deleted deletes the Apple-backed Sumly account. email-enabled/email-disabled are accepted without account mutation because Sumly does not use Apple relay email as an identity."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Notification accepted"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                payload:
                  type: "string"
                  maxLength: 16384
                  description: "Apple-signed JWS notification payload."
              required: ["payload"]
              additionalProperties: false

  /api/v1/app/auth/phone/code:
    post:
      tags: ["App Auth"]
      operationId: "nativePhoneCode"
      summary: "Mainland China SMS. Cooldown 60s; 5 sends/hour, 20/day per destination; 30/IP/hour and 1000 global/hour. Five guesses, five-minute validity."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeCodeSentResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                phone_number:
                  type: "string"
                  description: "Mainland China mobile, local 11 digits or +86 E.164."
              required: ["phone_number"]
              additionalProperties: false

  /api/v1/app/auth/phone/login:
    post:
      tags: ["App Auth"]
      operationId: "nativePhoneLogin"
      summary: "First verified phone auto-registers."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeLoginResultResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                phone_number:
                  type: "string"
                  description: "Mainland China mobile, local 11 digits or +86 E.164."
                code:
                  type: "string"
                  pattern: "^[0-9]{6}$"
              required: ["phone_number", "code"]
              additionalProperties: false

  /api/v1/app/auth/email/code:
    post:
      tags: ["App Auth"]
      operationId: "nativeEmailCode"
      summary: "Non-enumerating send response; same quotas as phone, shared across email purposes."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeCodeSentResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                  format: "email"
                  maxLength: 254
                purpose:
                  type: "string"
                  enum: ["register", "reset_password"]
              required: ["email", "purpose"]
              additionalProperties: false

  /api/v1/app/auth/email/register:
    post:
      tags: ["App Auth"]
      operationId: "nativeEmailRegister"
      summary: "Requires email verification; duplicate identities never overwrite credentials."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeLoginResultResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                  format: "email"
                  maxLength: 254
                password:
                  type: "string"
                  minLength: 12
                  maxLength: 128
                  description: "12–128 Unicode code points, at most 512 UTF-8 bytes; never trimmed."
                code:
                  type: "string"
                  pattern: "^[0-9]{6}$"
              required: ["email", "password", "code"]
              additionalProperties: false

  /api/v1/app/auth/email/login:
    post:
      tags: ["App Auth"]
      operationId: "nativeEmailLogin"
      summary: "Generic invalid credentials. Persistent password/IP quotas before hashing."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeLoginResultResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                  format: "email"
                  maxLength: 254
                password:
                  type: "string"
                  minLength: 12
                  maxLength: 128
                  description: "12–128 Unicode code points, at most 512 UTF-8 bytes; never trimmed."
              required: ["email", "password"]
              additionalProperties: false

  /api/v1/app/auth/email/reset-password:
    post:
      tags: ["App Auth"]
      operationId: "nativeEmailResetPassword"
      summary: "Single-use verified code; changes existing identity only and revokes all native sessions. Does not log in."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeEmptyResponse"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                  format: "email"
                  maxLength: 254
                code:
                  type: "string"
                  pattern: "^[0-9]{6}$"
                new_password:
                  type: "string"
                  minLength: 12
                  maxLength: 128
                  description: "12–128 Unicode code points, at most 512 UTF-8 bytes; never trimmed."
              required: ["email", "code", "new_password"]
              additionalProperties: false

  /api/v1/app/auth/email/link/code:
    post:
      tags: ["App Auth"]
      operationId: "nativeLinkedEmailCode"
      summary: "Send an account-bound email verification code to attach an email login."
      description: "Requires Google or Apple authentication within the last five minutes and the corresponding link capability. Uses the same delivery limits as the registration and password-reset routes."
      security: [{"bearerAuth": []}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                email: {type: "string", format: "email", maxLength: 254}
              required: ["email"]
              additionalProperties: false
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeCodeSentResponse"

  /api/v1/app/auth/email/link:
    post:
      tags: ["App Auth"]
      operationId: "nativeLinkEmail"
      summary: "Verify a new email and attach an email-password login to the active account."
      description: "Requires Google or Apple authentication within the last five minutes and a link code sent for this user. Invalid or expired code returns 422. A credential collision returns 409 and leaves both accounts intact."
      security: [{"bearerAuth": []}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                email: {type: "string", format: "email", maxLength: 254}
                code: {type: "string", pattern: "^[0-9]{6}$"}
                password:
                  type: "string"
                  minLength: 12
                  maxLength: 128
                  description: "12–128 Unicode code points, at most 512 UTF-8 bytes."
              required: ["email", "code", "password"]
              additionalProperties: false
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NativeEmptyResponse"

  /api/v1/app/auth/refresh:
    post:
      tags: ["App Auth"]
      operationId: "nativeRefresh"
      summary: "Single-use opaque refresh rotation; absolute 30-day lifetime. Does not renew primary authentication time."
      security: []
      responses:
        <<: *nativeErrors
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
