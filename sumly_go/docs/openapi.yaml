        phone:
          type: "boolean"
        email:
          type: "boolean"
        google:
          type: "boolean"
          description: "Included when Google sign-in is enabled."
        google_client_id:
          type: "string"
          description: "Public Web application OAuth client ID for Credential Manager."
        apple_email_link:
          type: "boolean"
          description: "Included only when Apple email linking is explicitly enabled and Sign in with Apple and SMTP are available."
      required: ["apple", "phone", "email"]
    NativeGoogleToken:
      type: "object"
