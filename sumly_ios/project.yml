name: Sumly
configs:
  Debug: debug
  Release: release
  InternalTest: release
options:
  bundleIdPrefix: com.oryjk
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 237PA3LEYJ
targets:
  Sumly:
    type: application
    platform: iOS
    sources:
      - Sumly/Sources
      - Sumly/Resources
      - SumlyWidget/Shared
    dependencies:
      - target: SumlyWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oryjk.sumly
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Sumly API App Store Distribution"
        InternalTest:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Sumly API App Store Distribution"
    entitlements:
      path: Sumly/Support/Sumly.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: Sumly/Support/Info.plist
      properties:
        CFBundleDisplayName: 记金
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "49"
        UILaunchScreen:
          UIColorName: NeoBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  # WidgetKit 桌面与锁屏小组件扩展：
  # - Debug 使用自动签名；Release / InternalTest 对齐主 App 手动签名规范（需在 Apple Developer 为 com.oryjk.sumly.widget 创建对应 Profile）。
  # - 暂不强制写入 App Group Entitlement，避免破坏主 App 现有 `Sumly API App Store Distribution` Profile 的能力集合；
  #   小组件运行时自动检测 App Group，未开通时通过公开只读 HTTP API 独立刷新并落盘本地缓存。
  SumlyWidget:
    type: app-extension
    platform: iOS
    sources:
      - SumlyWidget/Sources
      - SumlyWidget/Shared
      - Sumly/Sources/DesignSystem/GoldTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oryjk.sumly.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Sumly Widget App Store Distribution"
        InternalTest:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Sumly Widget App Store Distribution"
    entitlements:
      path: SumlyWidget/Support/SumlyWidget.entitlements
      properties: {}
    info:
      path: SumlyWidget/Support/Info.plist
      properties:
        CFBundleDisplayName: 记金小组件
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "49"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SumlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Sumly
schemes:
  Sumly:
    build:
      targets:
        Sumly: all
    test:
      targets:
        - SumlyTests
